<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Post</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h2 class="text-center mb-4">Create a New Post</h2>

            <div class="card shadow-sm p-4">
                <form id="createPostForm">
                    <div class="mb-3">
                        <label for="title" class="form-label">Post Title</label>
                        <input
                            type="text"
                            id="title"
                            class="form-control"
                            required
                        />
                    </div>

                    <div class="mb-3">
                        <label for="content" class="form-label">Content</label>
                        <textarea
                            id="content"
                            class="form-control"
                            rows="6"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Create Post
                    </button>
                </form>
            </div>

            <div id="message" class="mt-3 text-center"></div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const form = document.getElementById("createPostForm");
                const messageEl = document.getElementById("message");
                const user = JSON.parse(localStorage.getItem("user"));

                if (!user) {
                    messageEl.innerHTML = `<div class="alert alert-danger">You must be logged in to create a post.</div>`;
                    form.style.display = "none";
                    return;
                }

                form.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const title = document.getElementById("title").value.trim();
                    const content = document
                        .getElementById("content")
                        .value.trim();

                    if (!title || !content) {
                        return (messageEl.innerHTML = `<div class="alert alert-warning">Please fill in all fields.</div>`);
                    }

                    try {
                        const response = await fetch(
                            "http://127.0.0.1:8000/api/articles",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                },
                                credentials: "include",
                                body: JSON.stringify({
                                    title,
                                    content,
                                    user_id: user.id, // Laravel هيعرف اليوزر من السيشن برضه
                                }),
                            }
                        );

                        const data = await response.json();

                        if (response.ok) {
                            messageEl.innerHTML = `<div class="alert alert-success">Post created successfully!</div>`;
                            form.reset();
                        } else {
                            messageEl.innerHTML = `<div class="alert alert-danger">${
                                data.message || "Failed to create post"
                            }</div>`;
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        messageEl.innerHTML = `<div class="alert alert-danger">Something went wrong. Try again later.</div>`;
                    }
                });
            });
        </script>
    </body>
</html>
